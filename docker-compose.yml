services:
  db:
    image: postgres:16-alpine
    container_name: checkstock-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: checkstock
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
    ports:
      - "5432:5432"
    volumes:
      - checkstock_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    container_name: checkstock-web
    restart: unless-stopped
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  # Isolated PostgreSQL instance for integration tests. Not started by normal `up`.
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: checkstock_test
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkstock -d checkstock_test"]
      interval: 3s
      timeout: 3s
      retries: 15

  tests:
    build: .
    profiles: ["test"]
    environment:
      APP_ENV: test
      CHECKSTOCK_TESTING: "1"
      DATABASE_URL: postgresql+asyncpg://checkstock:checkstock@test-db:5432/checkstock_test
    command: ["pytest", "-q"]
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  checkstock_pgdata:
